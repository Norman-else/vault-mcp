[project]
name = "vault-mcp"
version = "0.1.0"
description = "MCP server for accessing HashiCorp Vault in AWS environments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0,<3.0.0",
    "hvac>=2.0.0",
    "boto3>=1.34.0",
    "certifi>=2024.2.2",
    "python-dotenv>=1.0.0",
    "slack-sdk>=3.27.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
]

[project.scripts]
vault-mcp = "vault_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vault_mcp"]
